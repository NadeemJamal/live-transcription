<!DOCTYPE html>
<html>
<head>
    <title>Test - No Buffering</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
        }
        #transcripts {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            min-height: 200px;
        }
        .transcript {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-left: 4px solid #28a745;
            border-radius: 4px;
        }
        .interim {
            border-left-color: #ffc107;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Test - No Buffering (Raw Output)</h1>
    <p>This shows EVERY transcript message as it arrives, with NO buffering.</p>

    <div>
        <button id="start">Start (Speechmatics - top_20 keywords)</button>
        <button id="stop">Stop</button>
    </div>

    <div id="transcripts"></div>

    <script>
        let ws = null;
        let audioContext = null;
        let processor = null;
        let stream = null;

        document.getElementById('start').onclick = async () => {
            // Connect to WebSocket with top_20 keywords (fast loading)
            const url = 'wss://live-transcription-production.up.railway.app/ws/transcribe?provider=speechmatics&keywords=top_20&max_delay=5.0';
            console.log('Connecting to:', url);

            ws = new WebSocket(url);

            ws.onopen = () => {
                console.log('✅ Connected');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);

                if (data.type === 'connected') {
                    startAudio();
                }

                if (data.type === 'transcript') {
                    // Display EVERY transcript as it arrives - NO BUFFERING
                    const div = document.createElement('div');
                    div.className = data.is_final ? 'transcript' : 'transcript interim';
                    div.innerHTML = `
                        <strong>${data.is_final ? 'FINAL' : 'INTERIM'}</strong>: ${data.text}
                        <br><small>${new Date().toLocaleTimeString()}</small>
                    `;
                    document.getElementById('transcripts').insertBefore(div, document.getElementById('transcripts').firstChild);
                }
            };

            ws.onerror = (error) => {
                console.error('❌ Error:', error);
            };

            ws.onclose = () => {
                console.log('🔌 Disconnected');
            };
        };

        async function startAudio() {
            console.log('🎙️ Starting audio capture...');

            stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    sampleRate: 16000,
                    channelCount: 1,
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

            audioContext = new AudioContext({ sampleRate: 16000 });
            const source = audioContext.createMediaStreamSource(stream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);

            processor.onaudioprocess = (e) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;

                const audioData = e.inputBuffer.getChannelData(0);
                const pcm = new Int16Array(audioData.length);
                for (let i = 0; i < audioData.length; i++) {
                    const s = Math.max(-1, Math.min(1, audioData[i]));
                    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }

                ws.send(pcm.buffer);
            };

            source.connect(processor);
            processor.connect(audioContext.destination);

            console.log('✅ Recording...');
        }

        document.getElementById('stop').onclick = () => {
            if (processor) processor.disconnect();
            if (audioContext) audioContext.close();
            if (stream) stream.getTracks().forEach(track => track.stop());
            if (ws) ws.close();
            console.log('⏸️ Stopped');
        };
    </script>
</body>
</html>
